name: Bug report
description: Report a reproducible SMTP, MIME, or runtime issue.
body:
  - type: markdown
    attributes:
      value: 'Use synthetic data. Never include credentials, message content, or real recipient lists. Report vulnerabilities privately using SECURITY.md.'
  - type: input
    id: version
    attributes:
      label: Package version and runtime
      placeholder: edge-mailer 0.8.0, Cloudflare Workers / Deno version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include TLS mode, auth mechanism, and a small synthetic example.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Include sanitized stage, responseCode, reason, and retryHint when available.
    validations:
      required: true
