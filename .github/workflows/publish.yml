name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm run release:dry-run

      - name: Publish to npm
        if: github.event_name == 'release'
        run: |
          package_version=$(node -p "require('./package.json').version")
          if npm view "edge-mailer@${package_version}" version >/dev/null 2>&1; then
            echo "edge-mailer@${package_version} is already published; skipping npm publish"
          else
            npm publish --access public
          fi

      - name: Publish to JSR
        if: github.event_name == 'release'
        run: deno publish --config jsr.json
