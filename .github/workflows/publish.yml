name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - run: npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm run release:dry-run
      - run: pnpm audit --audit-level=high

      - name: Publish to npm
        if: github.event_name == 'release'
        run: |
          package_version=$(node -p "require('./package.json').version")
          if npm view "edge-mailer@${package_version}" version >/dev/null 2>&1; then
            echo "edge-mailer@${package_version} is already published; skipping npm publish"
          else
            npm publish --access public
          fi

      - name: Publish to JSR
        if: github.event_name == 'release'
        run: deno publish --config jsr.json
